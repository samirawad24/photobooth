<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3ECDD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Booth">
<title>Cooper &amp; Marisa Photo Booth</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/cormorant-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="screen welcome" id="welcome">
  <div class="welcome-inner">
    <canvas class="welcome-art" id="welcome-art" aria-hidden="true"></canvas>
    <p class="eyebrow">Photo booth</p>
    <h1 class="names" id="welcome-names">Cooper <span class="amp">&amp;</span> Marisa</h1>
    <p class="date" id="welcome-date">June 4, 2027</p>
    <button class="btn primary big" id="begin" type="button">Tap to begin</button>
    <p class="error" id="cam-error" role="alert" hidden></p>
  </div>
</section>

<section class="screen paper choose" id="layout" hidden>
  <header class="bar">
    <button class="link" id="layout-back" type="button">Back</button>
  </header>
  <h2 class="title">Choose your layout</h2>
  <div class="layouts" id="layouts"></div>
</section>

<section class="screen dark camera" id="camera" hidden>
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="view"></canvas>
      <div class="count" id="count" aria-live="assertive"></div>
    </div>
    <p class="hint" id="hint">Look up at the camera</p>
  </div>
  <aside class="panel">
    <div class="panel-top">
      <button class="link light" id="cam-back" type="button">Back</button>
      <p class="progress" id="progress"></p>
    </div>
    <div class="panel-body">
      <p class="label" id="filters-label">Choose a filter</p>
      <div class="filters" id="filters"></div>
      <div class="tray" id="tray" hidden></div>
    </div>
    <button class="shutter" id="start" type="button"><span>Start</span></button>
  </aside>
</section>

<section class="screen paper review" id="review" hidden>
  <div class="print-wrap" id="print-wrap">
    <img class="print" id="print" alt="Your photo booth print">
  </div>
  <aside class="panel">
    <h2 class="title small">Pick your style</h2>
    <div class="themes" id="themes"></div>
    <p class="label on-paper">Filter</p>
    <div class="filters mini" id="review-filters"></div>
    <div class="actions">
      <button class="btn ghost" id="retake" type="button">Retake</button>
      <button class="btn primary" id="done" type="button">Done</button>
    </div>
  </aside>
</section>

<section class="screen paper thanks" id="thanks" hidden>
  <div class="welcome-inner">
    <canvas class="welcome-art" id="thanks-art" aria-hidden="true"></canvas>
    <h2 class="names small">Thank you</h2>
    <p class="date">Your photos are saved</p>
  </div>
</section>

<div class="flash" id="flash"></div>
<video id="video" playsinline muted autoplay></video>
<p class="version" id="version"></p>

<script type="module" src="booth.js"></script>
</body>
</html>
